name: Foundry evaluation gate
run-name: Foundry evaluation (${{ inputs.prompt || 'baseline' }})
on:
  pull_request:
    paths:
      - '23-evaluation-cicd/**'
      - '.github/workflows/foundry-evaluation.yml'
  workflow_dispatch:
    inputs:
      prompt:
        type: choice
        options: [baseline, regression]
        default: baseline
permissions:
  contents: read
jobs:
  evaluation:
    # Never evaluate untrusted fork code with Azure access. Same-repo PRs still
    # require approval through the protected GitHub environment configured below.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: foundry-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: 23-evaluation-cicd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restore and build file-based apps
        run: |
          dotnet restore demo.cs --configfile NuGet.Config
          dotnet build demo.cs --no-restore
          dotnet restore test_demo.cs --configfile NuGet.Config
          dotnet build test_demo.cs --no-restore
      - name: Offline regression tests
        run: dotnet run --file test_demo.cs --no-build --no-restore
      - name: Cloud evaluation and release gate
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          PROMPT: ${{ inputs.prompt || 'baseline' }}
        run: dotnet run --file demo.cs --no-build --no-restore -- --prompt "$PROMPT" --correctness-threshold 1 --coherence-threshold 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundry-evaluation-${{ github.sha }}
          path: 23-evaluation-cicd/evaluation-report.json
          if-no-files-found: warn
          retention-days: 7
